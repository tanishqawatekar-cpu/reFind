      <text x="46" y="188" class="row-txt">match_status</text>
      <text x="436" y="188" class="row-note">SUGGESTED / CONFIRMED</text>
    </g>
  </g>

  <!-- =====================================================================
       TABLE 6: activity_logs
       ===================================================================== -->
  <g transform="translate(44, 570)">
    <rect x="0" y="0" width="480" height="298" class="ent-box"/>
    <rect x="0" y="0" width="480" height="62" class="ent-hdr"/>
    <text x="22" y="39" class="ent-name">6. activity_logs</text>
