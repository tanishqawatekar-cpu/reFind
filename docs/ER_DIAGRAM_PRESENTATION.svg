  <!-- Bottom Note Bar -->
  <rect x="44" y="986" width="1832" height="66" rx="12" fill="#FFFFFF" stroke="#20243A" stroke-width="1.8"/>
  <text x="72" y="1026" style="font-size:17px; fill:#20243A; font-weight:700;">4 SQL Views (SQL SECURITY INVOKER):</text>
  <text x="405" y="1026" style="font-size:16.5px; fill:#535562;">1. vw_public_lost_gallery  •  2. vw_public_found_gallery  •  3. vw_detailed_matches (4 INNER JOINs, users ×2)  •  4. vw_dashboard_stats (11 KPIs)</text>
