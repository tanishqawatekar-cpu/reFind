      <text x="46" y="0" class="row-txt" font-weight="700">log_id</text>
      <text x="440" y="0" class="row-note">BIGINT AUTO_INCREMENT</text>

      <rect x="0" y="21" width="36" height="22" class="b-fk"/><text x="18" y="37" class="t-fk">FK</text>
      <text x="46" y="38" class="row-txt">user_id (NULLABLE)</text>
      <text x="440" y="38" class="row-note">ON DELETE SET NULL</text>

      <text x="46" y="82" class="row-txt">action_type</text>
      <text x="440" y="82" class="row-note">9 Lifecycle Event Types</text>

      <text x="46" y="126" class="row-txt">entity_type, entity_id</text>
      <text x="440" y="126" class="row-note">Target Record Link</text>

      <text x="46" y="170" class="row-txt">summary, created_at</text>
      <text x="440" y="170" class="row-note">INDEX (created_at DESC)</text>
    </g>
  </g>

  <!-- =====================================================================
       TABLE 3: found_items
       ===================================================================== -->
  <g transform="translate(730, 570)">
    <rect x="0" y="0" width="480" height="298" class="ent-box"/>
    <rect x="0" y="0" width="480" height="62" class="ent-hdr"/>
    <text x="22" y="39" class="ent-name">3. found_items</text>
    <text x="458" y="38" text-anchor="end" class="ent-tag">vw_public_found_gallery</text>

