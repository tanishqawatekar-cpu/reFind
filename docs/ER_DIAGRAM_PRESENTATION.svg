      <text x="440" y="38" class="row-note">NOT NULL -&gt; users</text>

      <text x="46" y="76" class="row-txt">item_name, category</text>
      <text x="440" y="76" class="row-note">8 Campus Categories</text>

      <text x="46" y="114" class="row-txt">location_lost, date_lost</text>
      <text x="440" y="114" class="row-note">Indexed for Matcher</text>

      <rect x="0" y="135" width="44" height="22" class="b-pr"/><text x="22" y="151" class="t-pr">PRIV</text>
      <text x="52" y="152" class="row-txt" fill="#8E283A">identifying_marks</text>
      <text x="440" y="152" class="row-note">Hidden in Public View</text>

      <text x="46" y="188" class="row-txt">status, image_path</text>
      <text x="440" y="188" class="row-note">OPEN/MATCHED/RECOVERED</text>
    </g>
  </g>

  <!-- =====================================================================
       TABLE 4: matches
       ===================================================================== -->
  <g transform="translate(1400, 152)">
    <rect x="0" y="0" width="476" height="298" class="ent-box"/>
    <rect x="0" y="0" width="476" height="62" class="ent-hdr"/>
    <text x="22" y="39" class="ent-name">4. matches</text>
    <text x="454" y="38" text-anchor="end" class="ent-tag">vw_detailed_matches</text>

    <g transform="translate(20, 92)">
      <rect x="0" y="-17" width="36" height="22" class="b-pk"/><text x="18" y="-1" class="t-pk">PK</text>
      <text x="46" y="0" class="row-txt" font-weight="700">match_id</text>
      <text x="436" y="0" class="row-note">INT AUTO_INCREMENT</text>

      <rect x="0" y="21" width="36" height="22" class="b-fk"/><text x="18" y="37" class="t-fk">FK</text>
      <rect x="40" y="21" width="36" height="22" class="b-uq"/><text x="58" y="37" class="t-uq">UQ</text>
      <text x="84" y="38" class="row-txt">lost_id, found_id</text>
      <text x="436" y="38" class="row-note">uq_matches_pair</text>

      <text x="46" y="76" class="row-txt" font-weight="700">match_score (0..100)</text>
      <text x="436" y="76" class="row-note">INDEX DESC + CHECK</text>

      <text x="46" y="114" class="row-txt">category/name/loc_pts</text>
